pipeline:
  id: philosophy_litterature_silver_gutenberg
  owner: data-platform
  version: 1
  description: Normalize the latest Gutenberg catalog snapshot into Silver works.

inputs:
  - id: bronze_catalog
    reader: unity_catalog_table
    options:
      table: ${catalog}.bronze.gutenberg_catalog_raw

transformations:
  - id: normalized_works
    input_id: bronze_catalog
    callable: products.philosophy_litterature.tables.silver.gutenberg_work.transform:transform

quality: []

outputs:
  - id: silver_gutenberg_work
    input_id: normalized_works
    writer: delta_merge
    contract: products.philosophy_litterature.tables.silver.gutenberg_work.contract:TableDefinition
    options:
      table: ${catalog}.silver.gutenberg_work
      keys: [gutenberg_id]

post_actions: []
