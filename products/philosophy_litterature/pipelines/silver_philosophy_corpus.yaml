pipeline:
  id: philosophy_litterature_silver_corpus
  owner: data-platform
  version: 1
  description: Join the reviewed selection to catalog works to publish the corpus.

inputs:
  - id: catalog_works
    reader: unity_catalog_table
    options:
      table: ${catalog}.silver.gutenberg_work

  - id: selection
    reader: product_callable      # curated report, not a table or a plain file
    options:
      callable: products.philosophy_litterature.selection_input:read
      report: ${report}

transformations:
  - id: corpus_works
    input_ids: [catalog_works, selection]   # frames arrive in this order
    callable: products.philosophy_litterature.tables.silver.philosophy_litterature_work.transform:transform

quality: []

outputs:
  - id: silver_philosophy_work
    input_id: corpus_works
    writer: delta_merge
    contract: products.philosophy_litterature.tables.silver.philosophy_litterature_work.contract:TableDefinition
    options:
      table: ${catalog}.silver.philosophy_litterature_work
      keys: [corpus_work_id]

post_actions: []
