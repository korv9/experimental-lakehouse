pipeline:
  id: drug_synergy_silver_to_gold
  owner: analytics-engineering
  version: 1
  description: Publish the synergy star schema — three dimensions and one fact.

inputs:
  - id: combinations
    reader: unity_catalog_table
    options:
      table: ${catalog}.silver.drug_combination

  - id: cell_lines
    reader: unity_catalog_table
    options:
      table: ${catalog}.silver.cell_line

  - id: drugs
    reader: unity_catalog_table
    options:
      table: ${catalog}.silver.drug

  - id: fingerprints
    reader: unity_catalog_table
    options:
      table: ${catalog}.silver.drug_fingerprint

transformations:
  - id: dim_drug
    input_ids: [drugs, fingerprints]
    callable: products.drug_synergy.tables.gold.dim_drug.transform:build

  - id: dim_cell_line
    input_id: cell_lines
    callable: products.drug_synergy.tables.gold.dim_cell_line.transform:build

  - id: dim_cancer_type
    input_id: cell_lines
    callable: products.drug_synergy.tables.gold.dim_cancer_type.transform:build

  - id: fact_drug_synergy
    input_ids: [combinations, cell_lines]
    callable: products.drug_synergy.tables.gold.fact_drug_synergy.transform:build

quality: []

outputs:
  - id: publish_dim_drug
    input_id: dim_drug
    writer: delta_table
    contract: products.drug_synergy.tables.gold.dim_drug.contract:TableDefinition
    options:
      table: ${catalog}.gold.dim_drug
      mode: overwrite

  - id: publish_dim_cell_line
    input_id: dim_cell_line
    writer: delta_table
    contract: products.drug_synergy.tables.gold.dim_cell_line.contract:TableDefinition
    options:
      table: ${catalog}.gold.dim_cell_line
      mode: overwrite

  - id: publish_dim_cancer_type
    input_id: dim_cancer_type
    writer: delta_table
    contract: products.drug_synergy.tables.gold.dim_cancer_type.contract:TableDefinition
    options:
      table: ${catalog}.gold.dim_cancer_type
      mode: overwrite

  - id: publish_fact_drug_synergy
    input_id: fact_drug_synergy
    writer: delta_table
    contract: products.drug_synergy.tables.gold.fact_drug_synergy.contract:TableDefinition
    options:
      table: ${catalog}.gold.fact_drug_synergy
      mode: overwrite

post_actions: []
