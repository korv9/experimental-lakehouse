# Quality rules for silver.cell_line.
# A cell line without a key or a ModelID cannot be joined from either side.

- name: cell_line_key_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: cell_line_key

- name: model_id_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: model_id

- name: oncotree_lineage_present
  criticality: warn      # some DepMap rows genuinely lack a lineage
  check:
    function: is_not_null
    arguments:
      column: oncotree_lineage
