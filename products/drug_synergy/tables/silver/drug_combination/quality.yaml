# Quality rules for silver.drug_combination.
#   error -> quarantined (kept out of Silver, visible in quarantine.drug_synergy)
#   warn  -> row kept, failure counted and persisted
#
# A row missing a drug or a cell line cannot be joined to anything, so it is an
# error. Score ranges are warnings: extreme values are rare but real, and
# dropping them would bias the model.

- name: drug_min_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: drug_min

- name: drug_max_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: drug_max

- name: cell_line_key_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: cell_line_key

- name: synergy_zip_in_plausible_range
  criticality: warn
  check:
    function: is_in_range
    arguments:
      column: synergy_zip
      min_limit: -100
      max_limit: 100

- name: synergy_bliss_in_plausible_range
  criticality: warn
  check:
    function: is_in_range
    arguments:
      column: synergy_bliss
      min_limit: -100
      max_limit: 100
