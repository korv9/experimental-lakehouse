pipeline:
  id: fashion_demand_land_bronze
  owner: data-platform
  version: 1
  description: >
    Land the H&M Kaggle export into Bronze. Both sources share the platform's
    landing callable and differ only by options, so adding a third file is a
    block of YAML rather than another module.

    The CSVs are read with the distributed csv_records reader: every column
    becomes a string and the row is kept verbatim as JSON. Bronze does not
    guess types — a source that renames a column must land, not fail.

    Volume note: transactions_train.csv is ~31.8M rows. Wrapping each row as
    JSON costs space, but it keeps Bronze uniform across the platform and Delta
    compresses it well. Land once, then work from the Delta table.

inputs:
  - id: transactions_csv
    reader: csv_records
    options:
      path: ${transactions_file}

  - id: articles_csv
    reader: csv_records
    options:
      path: ${articles_file}

transformations:
  - id: landed_transactions
    input_id: transactions_csv
    callable: lakehouse_platform.transforms.landing:land
    options:
      source_name: hm_transactions
      source_file: transactions_train.csv
      id_fields: [t_dat, customer_id, article_id]
      schema_version: 2022-kaggle

  - id: landed_articles
    input_id: articles_csv
    callable: lakehouse_platform.transforms.landing:land
    options:
      source_name: hm_articles
      source_file: articles.csv
      id_fields: [article_id]
      schema_version: 2022-kaggle

quality: []

outputs:
  - id: bronze_transactions
    input_id: landed_transactions
    writer: delta_table
    contract: products.fashion_demand.tables.bronze.hm_transactions_raw.contract:TableDefinition
    options:
      table: ${catalog}.bronze.hm_transactions_raw
      mode: append

  - id: bronze_articles
    input_id: landed_articles
    writer: delta_table
    contract: products.fashion_demand.tables.bronze.hm_articles_raw.contract:TableDefinition
    options:
      table: ${catalog}.bronze.hm_articles_raw
      mode: append

post_actions: []
