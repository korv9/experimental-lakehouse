pipeline:
  id: fashion_demand_bronze_to_silver
  owner: data-platform
  version: 1
  description: >
    Type and validate the landed H&M export. Transactions get a deterministic
    surrogate key because the source has none: a customer buying the same
    article twice on one day is two identical rows, so there is nothing to merge
    on until one is assigned.

    Rows that fail an error-level rule are quarantined rather than dropped, so
    "how much did we lose and why" stays a query rather than a guess.

inputs:
  - id: bronze_transactions
    reader: unity_catalog_table
    options:
      table: ${catalog}.bronze.hm_transactions_raw

  - id: bronze_articles
    reader: unity_catalog_table
    options:
      table: ${catalog}.bronze.hm_articles_raw

transformations:
  - id: typed_transactions
    input_id: bronze_transactions
    callable: products.fashion_demand.tables.silver.transactions.transform:transform

  - id: typed_articles
    input_id: bronze_articles
    callable: products.fashion_demand.tables.silver.articles.transform:transform

quality:
  - id: validated_transactions
    input_id: typed_transactions
    rules: ../tables/silver/transactions/quality.yaml
    on_failure: quarantine
    quarantine_table: ${catalog}.quarantine.hm_transactions

outputs:
  - id: silver_transactions
    input_id: validated_transactions
    writer: delta_merge
    contract: products.fashion_demand.tables.silver.transactions.contract:TableDefinition
    options:
      table: ${catalog}.silver.transactions
      keys: [transaction_id]

  - id: silver_articles
    input_id: typed_articles
    writer: delta_merge
    contract: products.fashion_demand.tables.silver.articles.contract:TableDefinition
    options:
      table: ${catalog}.silver.articles
      keys: [article_id]

post_actions: []
