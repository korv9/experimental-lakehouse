pipeline:
  id: fashion_demand_gold_to_features
  owner: data-science
  version: 1
  description: >
    Build the supervised training table for demand forecasting. This is the ML
    layer's entry point, and it is a normal ACON pipeline on purpose: features
    get the same contract check, quality gate and run logging as any other
    table, so a model's inputs are as governed as a dashboard's.

inputs:
  - id: daily_demand
    reader: unity_catalog_table
    options:
      table: ${catalog}.gold.fact_daily_demand

transformations:
  - id: engineered_features
    input_id: daily_demand
    callable: products.fashion_demand.tables.feature.demand_features.transform:transform

quality:
  - id: trainable_features
    input_id: engineered_features
    rules: ../tables/feature/demand_features/quality.yaml
    on_failure: quarantine
    quarantine_table: ${catalog}.quarantine.demand_features

outputs:
  - id: demand_features
    input_id: trainable_features
    writer: delta_merge
    contract: products.fashion_demand.tables.feature.demand_features.contract:TableDefinition
    options:
      table: ${catalog}.feature.demand_features
      keys: [article_id, sales_channel_id, feature_date]

post_actions: []
