# Quality gate for silver.transactions.
#
# Error-level rules quarantine the row. The test is not "is this value odd?" but
# "would keeping this row make the demand aggregate wrong?" — a transaction with
# no date lands in no day, and one with no article belongs to no series.

- name: transaction_date_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: transaction_date

- name: article_id_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: article_id

- name: customer_id_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: customer_id

# 1 = store, 2 = online. Anything else means the source changed its encoding,
# and a third channel silently folded into the panel would corrupt every series.
- name: sales_channel_is_known
  criticality: error
  check:
    function: is_in_range
    arguments:
      column: sales_channel_id
      min_limit: 1
      max_limit: 2

# Price is scaled by the source, so the bound is a sanity check rather than a
# currency range. Negative prices would be returns, which this export does not
# contain — if they appear, the assumption behind gross_revenue has broken.
- name: price_not_negative
  criticality: warn
  check:
    function: is_in_range
    arguments:
      column: price
      min_limit: 0
      max_limit: 100

- name: price_present
  criticality: warn
  check:
    function: is_not_null
    arguments:
      column: price
