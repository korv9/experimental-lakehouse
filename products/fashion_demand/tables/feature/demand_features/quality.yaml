# Quality gate for feature.demand_features.
#
# Feature tables need different rules from Silver tables. A Silver rule asks
# "is this record valid?"; a feature rule asks "is this row safe to train on?"
# The error-level rules below are the ones where a bad row does not merely add
# noise, it teaches the model something false.

# --- identity: a row that cannot be joined back to a fact is untraceable ---

- name: article_id_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: article_id

- name: sales_channel_id_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: sales_channel_id

- name: feature_date_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: feature_date

# --- the label: an unusable or impossible target biases every forecast ---

- name: target_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: target

- name: target_not_negative
  criticality: error
  check:
    function: is_in_range
    arguments:
      column: target
      min_limit: 0
      max_limit: 1000000

# Pins the build to one horizon. Mixing horizons in a training set is silent and
# ruinous: the model averages two different questions.
- name: horizon_is_the_declared_one
  criticality: error
  check:
    function: is_in_range
    arguments:
      column: horizon_days
      min_limit: 14
      max_limit: 14

# --- history: null is legitimate at the start of a series, so these warn ---
# Recorded in platform.data_quality_results, where they become a cold-start rate
# you can watch over time rather than rows that get quarantined.

- name: recent_history_available
  criticality: warn
  check:
    function: is_not_null
    arguments:
      column: units_sold_lag_1

- name: four_week_history_available
  criticality: warn
  check:
    function: is_not_null
    arguments:
      column: units_sold_mean_28d

- name: lagged_price_plausible
  criticality: warn
  check:
    function: is_in_range
    arguments:
      column: mean_unit_price_lag_1
      min_limit: 0
      max_limit: 10000
