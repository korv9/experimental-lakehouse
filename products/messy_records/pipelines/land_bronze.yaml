pipeline:
  id: messy_records_land_bronze
  owner: data-platform
  version: 1
  description: Land the messy demo seed file into append-only Bronze, verbatim.

inputs:
  - id: landed_records
    reader: json_records          # JSON array -> one raw_payload string per record
    options:
      path: ${source_file}

transformations:
  - id: bronze_rows
    input_id: landed_records
    callable: products.messy_records.tables.bronze.records_raw.transform:transform
    options:
      source_file: ${source_file}

quality: []                       # Bronze accepts everything; Silver is the gate

outputs:
  - id: bronze_records
    input_id: bronze_rows
    writer: delta_table
    contract: products.messy_records.tables.bronze.records_raw.contract:TableDefinition
    options:
      table: ${catalog}.bronze.messy_demo_records
      mode: append                # Bronze is append-only

post_actions: []
