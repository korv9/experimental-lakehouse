pipeline:
  id: example_works_bronze_to_silver
  owner: data-platform
  version: 1
  description: Publish normalized works from the example API landing table.

inputs:
  - id: bronze_works
    reader: unity_catalog_table
    options:
      table: ${catalog}.bronze.example_data_records

transformations:
  - id: normalized_works
    input_id: bronze_works
    callable: products.example_works.tables.silver.works.transform:transform

quality:
  - id: validated_works
    input_id: normalized_works
    rules: ../tables/silver/works/quality.yaml
    on_failure: quarantine
    quarantine_table: ${catalog}.quarantine.example_works

outputs:
  - id: silver_works
    input_id: validated_works
    writer: delta_merge
    options:
      table: ${catalog}.silver.works
      keys: [work_id]

post_actions: []
