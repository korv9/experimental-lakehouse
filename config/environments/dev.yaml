# Environment config: which catalog + storage the pipelines target.
# Keeping this separate lets the same code run against dev / prod by swapping
# the catalog name, without touching transforms.

environment: dev
catalog: dev_lakehouse
landing_volume: /Volumes/dev_lakehouse/landing/source_files
checkpoint_volume: /Volumes/dev_lakehouse/platform/checkpoints

schemas:
  platform: platform   # control tables (operational metadata)
  landing: landing     # governed non-tabular source files
  bronze: bronze       # raw, append-only
  silver: silver       # cleaned, conformed entities
  gold: gold           # data products
  quarantine: quarantine # rejected error-level records
  sandbox: sandbox     # isolated experiments
