# Copy this file for local experiments. Never commit real credentials.
endpoints:
  open_library_search:
    method: GET
    url: https://openlibrary.org/search.json
    params:
      q: data engineering
      limit: 3
    headers:
      Accept: application/json
    timeout: 15

  authenticated_example:
    method: GET
    url: https://api.example.com/v1/resources
    headers:
      Accept: application/json
      Authorization: Bearer ${EXAMPLE_API_TOKEN}
    params:
      page: 1
    timeout: 15
