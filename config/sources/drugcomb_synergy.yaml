# DrugComb drug-combination screening results.
#
# Downloaded once from https://drugcomb.org/download/ (v1.4 lives on Zenodo:
# https://zenodo.org/records/11102665 , summary_table_v1.4.csv, ~193 MB). The portal serves
# a full export rather than a paginated API, so this is a file source: download,
# drop into the landing Volume, then land it verbatim into Bronze.
#
# WARNING: the column names below come from the original project's BRAclean.py.
# The v1.4 summary table is documented with different names (drug_row, drug_col,
# cell_line_name, synergy_zip, ...). Check the header and update SOURCE_SCHEMA in
# tables/silver/drug_combination/transform.py before the first real run.

source_name: drugcomb_synergy
source_type: file
format: csv
path: datasets/drug_synergy/drugcombs_scored_sample.csv
schema_version: v1

authentication:
  type: none

expected_columns:
  - Drug1
  - Drug2
  - Cell line
  - ZIP
  - Bliss
  - Loewe
  - HSA

incremental:
  enabled: false        # full export; Bronze appends one batch per download

destination:
  bronze_table: bronze.drugcomb_synergy_raw
