# PubChem PUG REST — resolves drug names to compound identifiers and structures.
#
# This replaces the original project's fetch_cid.py / fetch_smile.py, which used
# a fixed sleep and a local JSON cache but had no retry logic. The platform's
# REST client adds exponential backoff, honours Retry-After (PubChem answers 503
# under load, which the original silently dropped), and the ingestion runner
# checkpoints per page so an interrupted pull resumes instead of restarting.
#
# PubChem asks for no more than 5 requests/second; we stay well under.

source_name: pubchem_compound
source_type: rest
base_url: https://pubchem.ncbi.nlm.nih.gov
endpoint: /rest/pug/compound
response_format: json
schema_version: v1

authentication:
  type: none

rate_limit:
  requests_per_second: 3      # PubChem policy allows 5; leave headroom

request:
  timeout: 30
  max_retries: 4              # honours Retry-After on 429/503
  headers:
    Accept: application/json

# Lookup mode: one request per drug name, no pages to walk. The notebook supplies
# the names; the runner tries each template in order, so a name miss falls back
# to the property endpoint. {value} is URL-encoded before substitution.
lookup:
  name: pubchem_name
  endpoint_template: /rest/pug/compound/name/{value}/property/IsomericSMILES,CanonicalSMILES/JSON
  fallback_endpoint_templates:
    - /rest/pug/compound/name/{value}/cids/JSON
    - /rest/pug/compound/xref/rn/{value}/cids/JSON   # CAS registry number

incremental:
  enabled: true
  strategy: appended_names    # only resolve drugs not already in Bronze
  watermark_column: ingested_at

destination:
  bronze_table: bronze.pubchem_compound_raw
