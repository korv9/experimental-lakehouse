# Production metadata source: Project Gutenberg's official compressed catalog.
source_name: project_gutenberg_catalog
source_type: compressed_csv
url: https://www.gutenberg.org/cache/epub/feeds/pg_catalog.csv.gz
schema_version: v1

request:
  timeout_seconds: 120
  max_retries: 4
  headers:
    Accept: application/octet-stream
    User-Agent: experimental-lakehouse/0.1 (+https://github.com/korv9/experimental-lakehouse)

file:
  name: pg_catalog.csv.gz
  compression: gzip
  landing_source: gutenberg
  landing_subpath: catalog
  required_columns:
    - Text#
    - Type
    - Issued
    - Title
    - Language
    - Authors
    - Subjects
    - LoCC
    - Bookshelves
