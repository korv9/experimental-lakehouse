# First Philosophy Books discovery source.
# Gutendex exposes Gutenberg metadata and links to downloadable public-domain files.
source_name: philosophy_litterature_gutendex
source_type: rest
base_url: https://gutendex.com
endpoint: /books/
response_format: json
schema_version: v1

authentication:
  type: none

rate_limit:
  requests_per_second: 1

pagination:
  type: page_number
  page_parameter: page
  # Gutendex currently returns 32 records per page. The extra query parameter is
  # harmless if ignored and keeps total-page calculation explicit.
  page_size_parameter: page_size
  page_size: 32
  records_path: results

request:
  params:
    languages: en

selection:
  type: corpus_report
  # Resolved relative to this source configuration file.
  report: ../../datasets/api_samples/philosophy_corpus_report.json
  accepted_statuses:
    - matched
    - matched_without_plain_text
  id_parameter: ids
  # Gutendex returns at most 32 records per page. Keeping batches below that
  # guarantees one complete response per approved ID batch.
  batch_size: 25

incremental:
  enabled: true
  strategy: replay_idempotently
  watermark_column: ingested_at

destination:
  bronze_table: bronze.philosophy_litterature_work_raw
  contract: products.philosophy_litterature.tables.bronze.philosophy_litterature_work_raw.contract:TableDefinition
