# DepMap cell-line metadata (Model.csv).
#
# Source: https://depmap.org/portal/download/ — released quarterly, downloaded
# as a file. Supplies the cancer-type annotation (OncotreeLineage) used to build
# gold.dim_cancer_type, and the ModelID that joins expression to cell lines.

source_name: depmap_model
source_type: file
format: csv
path: datasets/drug_synergy/depmap_model_sample.csv
schema_version: 24Q2          # DepMap release; bump on each new download

authentication:
  type: none

expected_columns:
  - ModelID
  - CellLineName
  - StrippedCellLineName
  - OncotreeLineage

incremental:
  enabled: false              # one row set per quarterly release

destination:
  bronze_table: bronze.depmap_model_raw
