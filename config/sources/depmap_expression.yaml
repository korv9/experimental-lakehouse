# DepMap RNA expression (OmicsExpressionTPMLogp1HumanProteinCodingGenes.csv).
#
# Source: https://depmap.org/portal/download/. A wide matrix: one row per cell
# line (ModelID) and one column per gene, values are log1p(TPM). Silver unpivots
# it to long format so Delta can store and filter it efficiently.
#
# The real file is roughly 1,800 rows x 19,000 gene columns.

source_name: depmap_expression
source_type: file
format: csv
path: datasets/drug_synergy/depmap_expression_sample.csv
schema_version: 24Q2

authentication:
  type: none

layout:
  orientation: wide           # models in rows, genes in columns
  key_column: ModelID

incremental:
  enabled: false

destination:
  bronze_table: bronze.depmap_expression_raw
