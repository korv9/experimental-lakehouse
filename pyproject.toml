[build-system]
requires = ["setuptools>=74"]
build-backend = "setuptools.build_meta"

[project]
name = "example-works-data-product"
version = "0.1.0"
description = "A minimal medallion data product powered by adidas Lakehouse Engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lakehouse-engine[dq,sharepoint]==2.1.1",
]

[project.optional-dependencies]
dev = [
    "lakehouse-engine[os]==2.1.1",
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["products*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
